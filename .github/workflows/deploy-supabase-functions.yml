name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main, master]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy order creation and tracking functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN in GitHub repository Actions secrets."
            exit 1
          fi
          supabase functions deploy create-order --project-ref bnwsnhhvrbwvjwvywjgc
          supabase functions deploy track-order --project-ref bnwsnhhvrbwvjwvywjgc
          supabase functions deploy save-push-subscription --project-ref bnwsnhhvrbwvjwvywjgc
