<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f47721"><meta name="robots" content="noindex,nofollow">
<title>Suivi de commande | Crustella</title><link rel="stylesheet" href="style.css">
<style>
.track-wrap{max-width:720px;margin:0 auto;padding:28px 5vw 70px}.track-card{margin-top:30px;background:#fff;border:1px solid #eee4da;border-radius:22px;padding:clamp(20px,5vw,36px);box-shadow:0 20px 70px #4a2b120b}.track-card h1{font:700 clamp(30px,6vw,44px)/1.08 'Space Grotesk',sans-serif;letter-spacing:-.05em;margin:5px 0 12px}.track-status{display:inline-block;background:#fff0df;color:#a84d0b;border-radius:30px;padding:9px 13px;font-size:12px;font-weight:800;margin:10px 0}.track-status.delivered,.track-status.confirmed{background:#eaf7ef;color:#217648}.track-status.out_for_delivery{background:#e8f1ff;color:#245da8}.track-status.cancelled{background:#feeceb;color:#b33d35}.track-list{display:grid;gap:10px;margin:20px 0}.track-item{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #eee4da;padding:10px 0;font-size:14px}.track-total{display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin-top:20px}.track-message{font-size:13px;line-height:1.7;color:#81776f;margin-top:15px;overflow-wrap:anywhere}.track-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:22px 0}.track-step{border-top:4px solid #eee4da;padding-top:8px;font-size:10px;color:#81776f}.track-step.active{border-color:#f47721;color:#211d19;font-weight:800}@media(max-width:500px){.track-steps{grid-template-columns:repeat(2,1fr);row-gap:15px}}

/* Order tracking page visual refresh only */
body{background:radial-gradient(ellipse at 50% 0,#fff0e2 0,#fffaf5 360px,#fffdfb 850px)}
.track-wrap{padding-top:36px}
.track-card{border-radius:26px;box-shadow:0 18px 55px #49280d0c;border-color:#f0e2d5}
.track-card h1{letter-spacing:-.055em}
.track-status{box-shadow:inset 0 0 0 1px #f4772110}
.track-list{background:#fffaf5;border:1px solid #f0e2d5;border-radius:16px;padding:10px 16px}
</style></head>
<body><main class="track-wrap">
<header class="admin-top"><a class="admin-brand" href="index.html"><span class="admin-mark">C</span><span>CRUSTELLA<small>SUIVI DE COMMANDE</small></span></a><a class="admin-link" href="index.html">← Boutique</a></header>
<section class="track-card"><p class="eyebrow">SUIVI EN DIRECT</p><h1 id="track-title">Ta commande arrive.</h1><p class="muted" id="track-subtitle">Vérification du lien de suivi…</p><div id="track-status" class="track-status">Chargement…</div>
<div id="track-steps" class="track-steps"></div><h2 style="font:700 20px 'Space Grotesk',sans-serif">Récapitulatif</h2><div id="track-items" class="track-list"></div><div class="track-total"><span>Total · paiement à la livraison</span><span id="track-total">—</span></div><p id="track-message" class="track-message" role="status"></p><button id="track-refresh" class="btn dark" type="button">Actualiser le suivi ↻</button></section>
</main>
<script src="supabase-config.js"></script><script src="track.js"></script></body></html>
